  <rect width="512" height="512" fill="#0b1220"/>
  <g transform="translate(256 256) scale(13) translate(-16 -16.25)">
    <path d="M16 23.5v5.5" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    <g fill="#10b981">
      <path d="M16 3.5 21.2 12H10.8z"/>
      <path d="M16 9 23.4 18.5H8.6z"/>
      <path d="M16 14.5 26 25.5H6z"/>
    </g>
  </g>
</svg>
